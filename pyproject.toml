[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "EpiProcessPy"
version = "0.1.0"
description = "A Python feature port of epiprocess"
readme = "README.md"
authors = [
  { name = "David Weber", email = "dsweber2@pm.me" },
  { name = "Dmitry Shemetov", email = "dmtryshmtv@gmail.com" },
]
requires-python = ">=3.10"
maintainers = [
  { name = "David Weber", email = "dsweber2@pm.me" },
  { name = "Dmitry Shemetov", email = "dmtryshmtv@gmail.com" },
]
classifiers = []
license = { text = "MIT license" }
dependencies = [
  "epidatpy @ git+https://github.com/cmu-delphi/epidatpy.git#egg=epidatpy",
  "epiweeks>=2.3.0",
  "pandas[parquet]>=2",
]

[project.urls]
bugs = "https://github.com/dsweber2/EpiProcessPy/issues"
homepage = "https://github.com/dsweber2/EpiProcessPy"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.ruff]
line-length = 120
format.docstring-code-format = true
format.docstring-code-line-length = "dynamic"
lint.extend-select = [
  "I",  # isort
  "UP", # pyupgrade
]

[dependency-groups]
dev = [
  "ipykernel>=6.29.5",
  "pytest>=8.3.3",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "ruff>=0.6.8",
  "ty>=0.0.12",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.1",
  "mkdocstrings[python]>=1.0.0",
]

[tool.coverage.run]
omit = ["src/EpiProcessPy/__init__.py", "src/EpiProcessPy/data.py"]
